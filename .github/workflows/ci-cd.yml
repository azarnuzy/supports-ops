name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supportops
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supportops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/api exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter @repo/api exec prisma migrate deploy

      - name: Check formatting and linting
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  changes:
    name: Detect changed apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.apps.outputs.any }}
      matrix: ${{ steps.apps.outputs.matrix }}
      services: ${{ steps.apps.outputs.services }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find affected apps
        id: apps
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [[ "${before}" == "0000000000000000000000000000000000000000" ]]; then
            mapfile -t files < <(git ls-files)
          else
            mapfile -t files < <(git diff --name-only "${before}" "${GITHUB_SHA}")
          fi
          apps=()
          for app in api worker business-system platform widget; do
            changed=false
            for file in "${files[@]}"; do
              case "${file}" in
                "apps/${app}/"*|packages/*|deploy/*|Dockerfile|.dockerignore|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json)
                  changed=true
                  break
                  ;;
              esac
            done
            [[ "${changed}" == true ]] && apps+=("${app}")
          done
          matrix="$(jq -cn '$ARGS.positional' --args "${apps[@]}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "services=${apps[*]}" >> "${GITHUB_OUTPUT}"
          [[ ${#apps[@]} -gt 0 ]] && echo "any=true" >> "${GITHUB_OUTPUT}" || echo "any=false" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish ${{ matrix.image }}
    needs: [ci, changes]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.matrix) }}

    env:
      IMAGE_PREFIX: ghcr.io/azarnuzy/supports-ops

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.image }}
          push: true
          build-args: |
            VITE_API_URL=https://api.support.azarnuzy.com
            VITE_WIDGET_URL=https://widget.support.azarnuzy.com
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to VPS
    needs: [changes, publish]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      IMAGE_PREFIX: ghcr.io/azarnuzy/supports-ops
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ vars.VPS_USER || 'ubuntu' }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      REMOTE_APP_DIRECTORY: /srv/apps/supports-ops

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Verify published images
        run: |
          for service in ${{ needs.changes.outputs.services }}; do
            docker buildx imagetools inspect "${IMAGE_PREFIX}-${service}:${GITHUB_SHA}"
          done

      - name: Configure SSH
        run: |
          test -n "${VPS_HOST}"
          test -n "${VPS_SSH_PRIVATE_KEY}"
          test -n "${VPS_KNOWN_HOSTS}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts"

      - name: Upload release configuration
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "test -f '${REMOTE_APP_DIRECTORY}/env.production'"
          scp -P "${VPS_PORT}" deploy/compose.prod.yaml deploy/deploy.sh \
            "${VPS_USER}@${VPS_HOST}:${REMOTE_APP_DIRECTORY}/"

      - name: Deploy release
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${REMOTE_APP_DIRECTORY}' && chmod 700 deploy.sh && ./deploy.sh '${GITHUB_SHA}' ${{ needs.changes.outputs.services }}"
