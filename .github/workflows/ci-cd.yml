name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/api exec prisma generate

      - name: Check formatting and linting
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  publish:
    name: Publish ${{ matrix.image }}
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: api
          - target: worker
            image: worker
          - target: platform
            image: platform
          - target: widget
            image: widget

    env:
      IMAGE_PREFIX: ghcr.io/azarnuzy/supports-ops

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            VITE_API_URL=https://api.support.azarnuzy.com
            VITE_WIDGET_URL=https://widget.support.azarnuzy.com
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      IMAGE_PREFIX: ghcr.io/azarnuzy/supports-ops
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_USER: ${{ vars.VPS_USER || 'ubuntu' }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      REMOTE_APP_DIRECTORY: /srv/apps/supports-ops

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Verify published images
        run: |
          docker buildx imagetools inspect "${IMAGE_PREFIX}-api:${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGE_PREFIX}-worker:${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGE_PREFIX}-platform:${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGE_PREFIX}-widget:${GITHUB_SHA}"

      - name: Configure SSH
        run: |
          test -n "${VPS_HOST}"
          test -n "${VPS_SSH_PRIVATE_KEY}"
          test -n "${VPS_KNOWN_HOSTS}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/id_ed25519" "${HOME}/.ssh/known_hosts"

      - name: Upload release configuration
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "test -f '${REMOTE_APP_DIRECTORY}/env.production'"
          scp -P "${VPS_PORT}" deploy/compose.prod.yaml deploy/deploy.sh \
            "${VPS_USER}@${VPS_HOST}:${REMOTE_APP_DIRECTORY}/"

      - name: Deploy release
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${REMOTE_APP_DIRECTORY}' && chmod 700 deploy.sh && ./deploy.sh '${GITHUB_SHA}'"
