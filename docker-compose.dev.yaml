name: supportops

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: support-ops-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supportops
    ports:
      - "15432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supportops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: support-ops-dev-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_dev_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  business-system:
    build:
      context: .
      target: business-system
    environment:
      BUSINESS_SYSTEM_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/supportops?schema=business_system"
      BUSINESS_SYSTEM_PORT: "8001"
    ports:
      - "${BUSINESS_SYSTEM_HOST_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
  redis_dev_data:
