# SupportOps — per-project OMP config
# Role mapping final, berdasarkan katalog `omp models devscale` + eligibility dashboard:
# - glm-5.3-flash  : ladder low/high/max, terbukti -> default & task
# - mimo-v2.6-flash: termurah ($0.14/$0.28), thinking TIDAK bisa dikontrol
#   (gateway mengabaikan reasoning_effort) -> smol tanpa suffix
# - muse-spark     : ladder minimal..xhigh -> plan & advisor
# - deepseek-v4.1-flash: tanpa thinking ladder -> selector tanpa suffix
# - glm-5.3, deepseek-v4-pro-0813, gemini-3.7-flash, dll TIDAK eligible
#   (dashboard ✗) -> tidak dipakai di role maupun fallback.

modelRoleStorage: project

modelRoles:
  # Daily coding / implementasi issue
  default: devscale/glm-5.3-flash:high

  # Cheap/fast worker: judul sesi, memory, target handoff Prewalk.
  smol: devscale/mimo-v2.6-flash

  # Subagent / task implementation
  task: devscale/glm-5.3-flash:high

  # Planning ticket kompleks; puncak ladder muse adalah :xhigh
  plan: devscale/muse-spark-1.3-contributor:xhigh

  # Second opinion / reviewer
  advisor: devscale/muse-spark-1.3-contributor:high

  # Eskalasi problem sulit; deepseek-v4.1-flash tanpa thinking ladder
  slow: devscale/deepseek-v4.1-flash

retry:
  fallbackChains:
    # Menangkap model live yang tidak terikat role (mis. /model manual)
    default:
      - devscale/mimo-v2.6-flash
      - devscale/gpt-5.6-luna:high

    task:
      - devscale/mimo-v2.6-flash
      - devscale/gpt-5.6-luna:high

    smol:
      - devscale/glm-5.3-flash:low

    plan:
      - devscale/gpt-5.6-luna:xhigh
      - devscale/deepseek-v4-flash-0731:max

    advisor:
      - devscale/gpt-5.6-luna:high

    slow:
      - devscale/muse-spark-1.3-contributor:xhigh
      - devscale/gpt-5.6-luna:max

# Advisor off secara default; nyalakan sementara via `/advisor on`
# atau `--advisor` untuk ticket berisiko agar cost tidak dobel.
advisor:
  enabled: false
  syncBacklog: "off"

defaultThinkingLevel: high
